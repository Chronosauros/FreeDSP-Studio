[package]
name = "freedsp-studio"
version = "0.8.0"
description = "EQ editor for USB-C DSP cables and dongles"
build = "build.rs"
authors = ["EffectiveEquivalent"]
license = "MIT"
repository = "https://github.com/EffectiveEquivalent/FreeDSP-Studio"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "freedsp-studio"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
hidapi = "2"
open = "5"
dirs = "6"
# The UI: egui drawn straight to the window through OpenGL, no web engine or GUI toolkit.
# Wayland and X11 are loaded at runtime, so nothing here is a hard dependency on Linux.
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
# File dialogs: native on Windows and macOS, the XDG desktop portal on Linux (no GTK).
rfd = "0.17"
# Audio for the treble listening test.
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Devices_HumanInterfaceDevice",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Linux packages, built in CI with cargo-deb and cargo-generate-rpm.
[package.metadata.deb]
name = "freedsp-studio"
maintainer = "EffectiveEquivalent"
section = "sound"
extended-description = "Read, edit and write the parametric EQ on USB-C DSP cables and dongles."
depends = "$auto"
recommends = "xdg-desktop-portal"
assets = [
  ["target/release/freedsp-studio", "usr/bin/", "755"],
  ["packaging/linux/freedsp-studio.desktop", "usr/share/applications/", "644"],
  ["assets/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/freedsp-studio.png", "644"],
  ["assets/icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/freedsp-studio.png", "644"],
  ["packaging/linux/70-freedsp-studio.rules", "usr/lib/udev/rules.d/", "644"],
]
maintainer-scripts = "packaging/linux/debian"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/freedsp-studio", dest = "/usr/bin/freedsp-studio", mode = "755" },
  { source = "packaging/linux/freedsp-studio.desktop", dest = "/usr/share/applications/freedsp-studio.desktop", mode = "644" },
  { source = "assets/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/freedsp-studio.png", mode = "644" },
  { source = "assets/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/freedsp-studio.png", mode = "644" },
  { source = "packaging/linux/70-freedsp-studio.rules", dest = "/usr/lib/udev/rules.d/70-freedsp-studio.rules", mode = "644" },
]
post_install_script = """
if command -v udevadm >/dev/null 2>&1; then
  udevadm control --reload-rules || true
  udevadm trigger --subsystem-match=hidraw || true
fi
"""

# Quicker local builds while working on the UI.
[profile.dev]
opt-level = 1
