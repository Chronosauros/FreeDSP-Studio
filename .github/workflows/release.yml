name: Release

# Builds the Windows exe, the macOS dmg and the Linux deb and rpm. Push a version tag (e.g.
# v0.8.0) to cut a release, or run it from the Actions tab to just get build artifacts. All jobs
# attach to the same release. Neither the Windows nor the macOS build is signed by a paid
# certificate: Windows shows a SmartScreen warning, macOS a Gatekeeper one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/app

      - name: Test
        run: cargo test --release --locked

      - name: Build portable exe
        run: cargo build --release --locked

      - name: Stage artifact
        run: Copy-Item "target/release/freedsp-studio.exe" "FreeDSP-Studio.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeDSP-Studio-windows
          path: tools/app/FreeDSP-Studio.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/app/FreeDSP-Studio.exe

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: tools/app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary, so one download covers Apple Silicon and Intel.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/app

      - name: Test
        run: cargo test --release --locked

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      # The .app is put together by hand: a universal binary, the plist and the icon. Ad-hoc
      # signing is free and needs no Apple account; it is what lets the app run at all on Apple
      # Silicon. It is NOT notarisation.
      - name: Bundle universal .app and dmg
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          app="dist/FreeDSP Studio.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/freedsp-studio" \
            target/aarch64-apple-darwin/release/freedsp-studio \
            target/x86_64-apple-darwin/release/freedsp-studio
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          cp assets/icons/icon.icns "$app/Contents/Resources/icon.icns"
          codesign --force --deep --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          ln -s /Applications dist/Applications
          hdiutil create -volname "FreeDSP Studio" -srcfolder dist -ov -format UDZO FreeDSP-Studio-macOS.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeDSP-Studio-macos
          path: tools/app/FreeDSP-Studio-macOS.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/app/FreeDSP-Studio-macOS.dmg

  linux:
    # 22.04 rather than latest: the binary links against the build machine's glibc, so the
    # older the base, the more distros it runs on.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tools/app
    steps:
      - uses: actions/checkout@v4

      # ALSA for the listening test's sound and libudev for hidraw. That is all it links;
      # Wayland, X11 and OpenGL are loaded at run time.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/app

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Test
        run: cargo test --release --locked

      - name: Build deb and rpm
        run: |
          cargo deb --locked
          cargo generate-rpm

      # The same binary in a tarball, for distros that take neither: the udev rule, a
      # desktop entry and an install script beside it.
      - name: Stage artifacts
        run: |
          cp target/debian/*.deb FreeDSP-Studio-linux-amd64.deb
          cp target/generate-rpm/*.rpm FreeDSP-Studio-linux-amd64.rpm
          d=FreeDSP-Studio-linux-x86_64
          mkdir -p $d
          cp target/release/freedsp-studio packaging/linux/70-freedsp-studio.rules packaging/linux/freedsp-studio.desktop $d/
          cp assets/icons/128x128.png $d/freedsp-studio.png
          cp packaging/linux/tarball/install.sh packaging/linux/tarball/README.txt $d/
          tar -czf FreeDSP-Studio-linux-x86_64.tar.gz --owner=0 --group=0 $d

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeDSP-Studio-linux
          path: |
            tools/app/FreeDSP-Studio-linux-amd64.deb
            tools/app/FreeDSP-Studio-linux-amd64.rpm
            tools/app/FreeDSP-Studio-linux-x86_64.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tools/app/FreeDSP-Studio-linux-amd64.deb
            tools/app/FreeDSP-Studio-linux-amd64.rpm
            tools/app/FreeDSP-Studio-linux-x86_64.tar.gz
